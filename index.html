<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c10" />
    <script>
      // Apply the saved theme before the first paint to avoid a dark flash on the light theme.
      try {
        if (localStorage.getItem('custodes11.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf8f2');
        }
      } catch (error) {
        /* Storage unavailable: keep the default dark theme. */
      }
    </script>
    <meta name="description" content="Referencia personal de Adeptus Custodes (11ª edición)." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Custodes 11ª</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
